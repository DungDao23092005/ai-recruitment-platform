name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_NAME: ai_recruitment_platform_test
  DATABASE_USER: sa
  DATABASE_PASSWORD: TestPassword123!
  GEMINI_API_KEY: "dummy-key-for-testing"
  SECRET_KEY: "test-secret-key-change-in-production"
  ENVIRONMENT: testing
  LOG_LEVEL: DEBUG

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-22.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${{ env.DATABASE_PASSWORD }} -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.8.0
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -sf http://localhost:6333/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # BẮT BUỘC: Cài Python dependencies (chứa pyodbc) TRƯỚC khi verify driver
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cài đặt chuẩn từ repo của Microsoft sử dụng OS version gốc (lsb_release -rs)
      - name: Install ODBC Driver and SQL tools for SQL Server
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg2 lsb-release
          
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          
          curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc unixodbc-dev
          
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc

      - name: Verify ODBC Driver Installation
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          
          echo "=== ODBC Configuration ==="
          odbcinst -j
          cat /etc/odbcinst.ini
          
          echo "=== Python pyodbc Drivers ==="
          python -c "
          import pyodbc
          drivers = pyodbc.drivers()
          print('Available drivers:', drivers)
          if 'ODBC Driver 18 for SQL Server' not in drivers:
              print('ERROR: ODBC Driver 18 for SQL Server NOT FOUND in pyodbc drivers!')
              exit(1)
          print('SUCCESS: ODBC Driver 18 for SQL Server is available')
          "

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Create test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ env.DATABASE_PASSWORD }}" -C -Q "CREATE DATABASE [${{ env.DATABASE_NAME }}]"
        env:
          PATH: "${{ env.PATH }}:/opt/mssql-tools18/bin"

      - name: Verify SQL Server Connectivity
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ env.DATABASE_PASSWORD }}" -C -Q "SELECT @@VERSION"
        env:
          PATH: "${{ env.PATH }}:/opt/mssql-tools18/bin"

      - name: Run backend unit tests
        run: |
          cd backend
          python -m pytest tests/unit -v --tb=short -x
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 1433
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          DATABASE_USER: ${{ env.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          DATABASE_DRIVER: "ODBC Driver 18 for SQL Server"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          CROSS_ENCODER_MODEL_NAME: "cross-encoder/ms-marco-MiniLM-L-6-v2"
          FINAL_SCORE_THRESHOLD: 0.3
          VECTOR_DIMENSION: 384
          EMBEDDING_MODEL_NAME: "BAAI/bge-small-en-v1.5"
          MAILPIT_HOST: localhost
          MAILPIT_PORT: 1025
          EMAIL_PROVIDER: mailpit

      - name: Run backend integration tests
        run: |
          cd backend
          python -m pytest tests/integration -v --tb=short -x
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 1433
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          DATABASE_USER: ${{ env.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          DATABASE_DRIVER: "ODBC Driver 18 for SQL Server"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          CROSS_ENCODER_MODEL_NAME: "cross-encoder/ms-marco-MiniLM-L-6-v2"
          FINAL_SCORE_THRESHOLD: 0.3
          VECTOR_DIMENSION: 384
          EMBEDDING_MODEL_NAME: "BAAI/bge-small-en-v1.5"
          MAILPIT_HOST: localhost
          MAILPIT_PORT: 1025
          EMAIL_PROVIDER: mailpit