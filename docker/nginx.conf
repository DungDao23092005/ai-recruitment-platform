server {
    listen 3000;
    server_name localhost;

    # Explicit upload/request body limit (10MB)
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers for frontend (browser-facing)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API requests to the FastAPI backend (service name inside Docker network)
    # Dynamic DNS resolution using Docker's embedded DNS (127.0.0.11) to handle
    # backend container IP changes after recreation without stale DNS caching.
    location /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # SSE endpoint for real-time notifications
    location /api/v1/notifications/stream {
        resolver 127.0.0.11 valid=10s;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
