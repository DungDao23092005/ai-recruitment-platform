services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: recruitment_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: mssql
      DATABASE_PORT: 1433
      # Development database is isolated from the test database. Never point
      # the dev backend at ai_recruitment_platform_itest/_test (pytest drop_all
      # would destroy dev data).
      DATABASE_NAME: ai_recruitment_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      # GEMINI_API_KEY đi qua env_file: .env (tránh ghi đè bằng giá trị rỗng)
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.5-flash}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - recruitment-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: recruitment_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - recruitment-net

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitment_mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - recruitment-net

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - recruitment-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: recruitment_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - recruitment-net

volumes:
  mssql_data:
  redis_data:
  qdrant_data:

networks:
  recruitment-net:
    driver: bridge