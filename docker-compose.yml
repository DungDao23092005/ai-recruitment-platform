version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: recruitment_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mssql
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    env_file:
      - .env
    depends_on:
      - mssql
      - redis
      - qdrant
    networks:
      - recruitment-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: recruitment_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - recruitment-net

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitment_mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrongPass123!}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    networks:
      - recruitment-net

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recruitment-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: recruitment_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - recruitment-net

volumes:
  mssql_data:
  redis_data:
  qdrant_data:

networks:
  recruitment-net:
    driver: bridge
